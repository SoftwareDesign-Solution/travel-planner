services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: travel_planner
      POSTGRES_PASSWORD: travel_planner
    ports:
      - "5432:5432"
    volumes:
      - travel-planner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_planner -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel-planner-postgres-data:

